    body{
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    /* ---------- Loading Screen ---------- */
    #loading_screen{
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      transition: opacity 0.5s ease;
    }
    #loading_content{
      text-align: center;
      width: 80%;
      max-width: 420px;
    }
    #loading_title{
      font-size: 1.8rem;
      letter-spacing: 1px;
      margin-bottom: 36px;
      font-weight: 400;
      text-transform: uppercase;
    }
    #loading_bar_track{
      width: 100%;
      height: 6px;
      background-color: rgba(255,255,255,0.15);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    #loading_bar_fill{
      height: 100%;
      width: 0%;
      background-color: #fff;
      transition: width 0.2s ease-out;
    }
    #loading_percent{
      font-size: 1rem;
      letter-spacing: 1px;
      margin: 0 0 8px 0;
    }
    #loading_status{
      font-size: 0.8rem;
      opacity: 0.6;
      margin: 0;
      letter-spacing: 0.5px;
    }

    /* ---------- Main Container ---------- */
    #main_container{
        position: absolute;
        z-index: 100;
        background-color: black;
        width: 100vw;
        height: 100vh;
        display: none; /* revealed once preloading finishes */
    }
    #start_text{
      position: absolute;
      top: calc(50% - 45px); /* Places it above the button */
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
  }

  #start_vr{
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      padding: 5px 15px;
      cursor: pointer;
  }

  /* ---------- Audio Enable/Disable Prompt ---------- */
  #audio_prompt{
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.88);

  <!-- ---------- Preloader: fetches every VR asset before the app is usable ---------- -->
  <script>
    (function () {
      // Every image the experience will ever need, gathered up front so the
      // browser has them cached before the user can start exploring.
      const imagesToPreload = [
        // UI chrome
        './images/background_image.jpg',
        './images/arrow_model2.png',
        './images/close.png',
        './images/eye.webp',
        './images/hotspot.webp',

        // 360 panorama scenes
        './images/vr_images/1.png',
        './images/vr_images/2.png',
        './images/vr_images/3.png',
        './images/vr_images/4.png',
        './images/vr_images/5.jpg',
        './images/vr_images/6.png',
        './images/vr_images/7.jpg',
        './images/vr_images/real_8.png',
        './images/vr_images/8.png',
        './images/vr_images/9.jpg',
        './images/vr_images/13.png',
        './images/vr_images/10.png',
        './images/vr_images/11.jpg',
        './images/vr_images/12.png',

        // Hotspot info-card photos
        './images/objects/scene2_1.JPG',
        './images/objects/SKP09355.JPG'
      ];

      const loadingScreen = document.getElementById('loading_screen');
      const loadingBarFill = document.getElementById('loading_bar_fill');
      const loadingPercent = document.getElementById('loading_percent');
      const loadingStatus = document.getElementById('loading_status');
      const mainContainer = document.getElementById('main_container');

      function preloadImages(urls, onProgress) {
        let loaded = 0;
        const total = urls.length;
        const promises = urls.map((url) => {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              loaded++;
              onProgress(loaded, total, url, 'ok');
              resolve({ url, status: 'ok' });
            };
            img.onerror = () => {
              loaded++;
              onProgress(loaded, total, url, 'error');
              resolve({ url, status: 'error' });
            };
            img.src = url;
          });
        });
        return Promise.all(promises);
      }

      preloadImages(imagesToPreload, (loaded, total, url, status) => {
        const percent = Math.round((loaded / total) * 100);
        loadingBarFill.style.width = percent + '%';
        loadingPercent.textContent = percent + '%';
        loadingStatus.textContent = 'Loading assets… (' + loaded + '/' + total + ')';
        if (status === 'error') {
          console.warn('Failed to preload image:', url);
        }
      }).then((results) => {
        const failed = results.filter((r) => r.status === 'error');
        if (failed.length) {
          console.warn('Some images failed to preload:', failed.map((f) => f.url));
        }
        loadingStatus.textContent = 'Ready';
        // brief pause so the 100% state is visible, then reveal the app
        setTimeout(() => {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            mainContainer.style.display = 'block';
          }, 500);
        }, 250);
      });
    })();
  </script>

    <script>
    const startVrButton = document.getElementById('start_vr');
    const aScene = document.querySelector('a-scene');
    const mainContainer = document.getElementById('main_container');
    const audioPrompt = document.getElementById('audio_prompt');
    const enableAudioBtn = document.getElementById('enable_audio_btn');
    const disableAudioBtn = document.getElementById('disable_audio_btn');
    const bgAudio = document.getElementById('bg_audio');

    startVrButton.addEventListener('click', () => {
      audioPrompt.style.display = 'flex';
    });

    enableAudioBtn.addEventListener('click', () => {
      bgAudio.volume = 0.6;
      bgAudio.play().catch((err) => {
        console.warn('Background audio could not autoplay:', err);
      });
      audioPrompt.style.display = 'none';
      enterVRMode();
    });

    disableAudioBtn.addEventListener('click', () => {
      audioPrompt.style.display = 'none';
      enterVRMode();
    });

    function enterVRMode() {
    mainContainer.style.display = 'none';

    aScene.setAttribute('visible', 'true');

    if (aScene.enterVR) {
        aScene.enterVR();
    }
    }
  </script>
